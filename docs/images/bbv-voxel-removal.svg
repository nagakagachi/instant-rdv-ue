<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <rect width="1500" height="620" fill="#ffffff"/>
  <style>.title{font:600 22px Arial,sans-serif;fill:#1f2933}.label{font:16px Arial,sans-serif;fill:#374151}.small{font:14px Arial,sans-serif;fill:#4b5563}.line{stroke:#374151;stroke-width:2;fill:none}.depth{stroke:#111827;stroke-width:6}.remove{fill:#dc2626}.keep{fill:#2563a6}.panel{fill:#f8fafc;stroke:#6b7280;stroke-width:2}</style>
  <text x="52" y="52" class="title">BBV voxel removal</text><text x="52" y="80" class="small">Project a BBV voxel into the current view and compare its depth with the SceneDepth sample.</text>
  <rect x="60" y="122" width="650" height="410" class="panel"/><text x="88" y="160" class="title">Voxel in front of SceneDepth</text><text x="88" y="188" class="small">zVoxel &lt; zSceneDepth</text>
  <path d="M100 330 H620" class="line"/><path d="M115 321 L103 330 L115 339" class="line"/><text x="91" y="305" class="label">camera</text>
  <rect x="290" y="290" width="80" height="80" class="remove"/><text x="276" y="397" class="label">BBV voxel</text><text x="276" y="422" class="small">zVoxel</text>
  <line x1="535" y1="240" x2="535" y2="420" class="depth"/><text x="455" y="226" class="label">SceneDepth surface</text><text x="482" y="450" class="small">zSceneDepth</text>
  <path d="M370 330 H523" class="line"/><path d="M511 321 L523 330 L511 339" class="line"/><text x="406" y="313" class="small">depth increases</text>
  <rect x="88" y="470" width="550" height="36" fill="#fee2e2"/><text x="108" y="495" class="label">Result: remove occupancy bit</text>
  <rect x="790" y="122" width="650" height="410" class="panel"/><text x="818" y="160" class="title">Voxel at or behind SceneDepth</text><text x="818" y="188" class="small">zVoxel ≥ zSceneDepth</text>
  <path d="M830 330 H1350" class="line"/><path d="M845 321 L833 330 L845 339" class="line"/><text x="821" y="305" class="label">camera</text>
  <line x1="1035" y1="240" x2="1035" y2="420" class="depth"/><text x="955" y="226" class="label">SceneDepth surface</text><text x="982" y="450" class="small">zSceneDepth</text>
  <rect x="1190" y="290" width="80" height="80" class="keep"/><text x="1176" y="397" class="label">BBV voxel</text><text x="1176" y="422" class="small">zVoxel</text>
  <path d="M1047 330 H1178" class="line"/><path d="M1166 321 L1178 330 L1166 339" class="line"/><text x="1070" y="313" class="small">depth increases</text>
  <rect x="818" y="470" width="550" height="36" fill="#dbeafe"/><text x="838" y="495" class="label">Result: keep occupancy bit</text>
  <text x="60" y="580" class="small">Removal only clears voxels that the current depth sample proves are in front of the visible surface.</text>
</svg>
