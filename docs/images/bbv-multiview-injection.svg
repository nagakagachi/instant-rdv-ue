<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850">
  <rect width="1800" height="850" fill="#ffffff"/>
  <style>.title{font:600 23px Arial,sans-serif;fill:#1f2933}.label{font:16px Arial,sans-serif;fill:#374151}.small{font:14px Arial,sans-serif;fill:#4b5563}.box{fill:#f8fafc;stroke:#6b7280;stroke-width:2}.grid{stroke:#9ca3af;stroke-width:1;fill:none}.brick{stroke:#111827;stroke-width:3;fill:none}.outline{stroke:#374151;stroke-width:4;fill:none}.viewray{stroke:#9ca3af;stroke-width:2;stroke-dasharray:6 5;fill:none}.mainflow{stroke:#2563a6;stroke-width:3;fill:none}.shadowflow{stroke:#b45309;stroke-width:3;fill:none}.main{fill:#2563a6}.shadow{fill:#d97706}</style>
  <text x="52" y="54" class="title">BBV injection from MainView SceneDepth and Directional ShadowMap</text>

  <rect x="50" y="105" width="500" height="680" class="box"/>
  <text x="78" y="145" class="title">1. Same scene</text>
  <text x="78" y="172" class="small">The camera is left of the house. The directional light is above it.</text>
  <path d="M210 620 H410 V430 L310 300 L210 430 Z" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
  <rect x="286" y="520" width="48" height="100" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <rect x="235" y="470" width="42" height="40" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <rect x="345" y="470" width="42" height="40" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <text x="282" y="659" class="label">house</text>
  <rect x="85" y="505" width="44" height="34" fill="#374151"/><path d="M129 511 L153 522 L129 533 Z" fill="#374151"/><circle cx="104" cy="522" r="9" fill="#ffffff"/><text x="72" y="571" class="label">MainView camera</text>
  <path d="M153 430 H210 M153 500 H210 M153 570 H210" class="viewray"/>
  <circle cx="310" cy="220" r="23" fill="#d97706"/><path d="M310 185 V167 M310 255 V273 M275 220 H257 M345 220 H363 M285 195 L272 182 M335 245 L348 258 M335 195 L348 182 M285 245 L272 258" stroke="#b45309" stroke-width="3"/><text x="341" y="226" class="label">directional light</text>
  <path d="M260 260 V365 M310 260 V300 M360 260 V365" stroke="#d6a15c" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <text x="78" y="735" class="small">MainView observes the camera-facing wall and roof contour.</text><text x="78" y="758" class="small">The ShadowMap observes the light-facing roof contour.</text>

  <rect x="625" y="105" width="530" height="680" class="box"/>
  <text x="653" y="145" class="title">2. Depth outputs of the same house</text>
  <rect x="655" y="180" width="470" height="240" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><text x="680" y="215" class="label">MainView SceneDepth</text>
  <rect x="700" y="285" width="40" height="30" fill="#374151"/><path d="M740 291 L762 300 L740 309 Z" fill="#374151"/><circle cx="717" cy="300" r="7" fill="#ffffff"/><path d="M762 255 H850 M762 300 H810 M762 345 H810" class="viewray"/>
  <path d="M900 245 L830 315 V365" class="outline"/><path d="M900 245 L830 315 V365" stroke="#2563a6" stroke-width="8" fill="none"/><text x="680" y="390" class="small">camera-facing first-hit depth: left roof and wall</text>
  <rect x="655" y="470" width="470" height="240" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><text x="680" y="505" class="label">Directional ShadowMap</text>
  <circle cx="890" cy="540" r="16" fill="#d97706"/><path d="M890 514 V498 M890 566 V582 M864 540 H848 M916 540 H932 M872 522 L860 510 M908 558 L920 570 M908 522 L920 510 M872 558 L860 570" stroke="#b45309" stroke-width="3"/>
  <path d="M830 575 V680 M890 575 V620 M950 575 V680" stroke="#d6a15c" stroke-width="2" stroke-dasharray="6 5" fill="none"/><path d="M800 700 L890 620 L980 700" class="outline"/><path d="M800 700 L890 620 L980 700" stroke="#d97706" stroke-width="8" fill="none"/><text x="680" y="688" class="small">light-facing first-hit depth: roof contour</text>

  <path d="M550 300 H625" class="mainflow"/><path d="M613 291 L625 300 L613 309" class="mainflow"/><path d="M550 570 H625" class="shadowflow"/><path d="M613 561 L625 570 L613 579" class="shadowflow"/>
  <path d="M1155 300 H1315" class="mainflow"/><path d="M1303 291 L1315 300 L1303 309" class="mainflow"/><path d="M1155 570 H1450 V272" class="shadowflow"/><path d="M1441 284 L1450 272 L1459 284" class="shadowflow"/>

  <rect x="1215" y="105" width="535" height="680" class="box"/>
  <text x="1243" y="145" class="title">3. BBV occupancy from both views</text>
  <text x="1243" y="172" class="small">Same camera-left / light-top relation as the scene.</text>
  <rect x="1360" y="300" width="320" height="320" class="grid"/>
  <path d="M1380 300 V620 M1400 300 V620 M1420 300 V620 M1440 300 V620 M1460 300 V620 M1480 300 V620 M1500 300 V620 M1520 300 V620 M1540 300 V620 M1560 300 V620 M1580 300 V620 M1600 300 V620 M1620 300 V620 M1640 300 V620 M1660 300 V620 M1360 320 H1680 M1360 340 H1680 M1360 360 H1680 M1360 380 H1680 M1360 400 H1680 M1360 420 H1680 M1360 440 H1680 M1360 460 H1680 M1360 480 H1680 M1360 500 H1680 M1360 520 H1680 M1360 540 H1680 M1360 560 H1680 M1360 580 H1680 M1360 600 H1680" class="grid"/>
  <rect x="1360" y="300" width="160" height="160" class="brick"/><rect x="1520" y="300" width="160" height="160" class="brick"/><rect x="1360" y="460" width="160" height="160" class="brick"/><rect x="1520" y="460" width="160" height="160" class="brick"/>
  <path d="M1420 580 H1600 V440 L1510 360 L1420 440 Z" class="outline"/>
  <rect x="1420" y="440" width="20" height="20" class="main"/><rect x="1440" y="420" width="20" height="20" class="main"/><rect x="1460" y="400" width="20" height="20" class="main"/><rect x="1480" y="380" width="20" height="20" class="main"/><rect x="1420" y="460" width="20" height="20" class="main"/><rect x="1420" y="480" width="20" height="20" class="main"/><rect x="1420" y="500" width="20" height="20" class="main"/><rect x="1420" y="520" width="20" height="20" class="main"/><rect x="1420" y="540" width="20" height="20" class="main"/><rect x="1420" y="560" width="20" height="20" class="main"/>
  <rect x="1480" y="380" width="20" height="20" class="shadow"/><rect x="1500" y="360" width="20" height="20" class="shadow"/><rect x="1520" y="380" width="20" height="20" class="shadow"/><rect x="1540" y="400" width="20" height="20" class="shadow"/><rect x="1560" y="420" width="20" height="20" class="shadow"/>
  <rect x="1250" y="495" width="42" height="32" fill="#374151"/><path d="M1292 501 L1314 511 L1292 521 Z" fill="#374151"/><circle cx="1267" cy="511" r="7" fill="#ffffff"/><text x="1238" y="555" class="small">MainView camera</text><path d="M1314 511 H1350" class="viewray"/>
  <circle cx="1510" cy="235" r="17" fill="#d97706"/><path d="M1510 208 V194 M1510 262 V276 M1483 235 H1469 M1537 235 H1551 M1491 216 L1482 207 M1529 254 L1538 263 M1529 216 L1538 207 M1491 254 L1482 263" stroke="#b45309" stroke-width="3"/><path d="M1510 263 V350" stroke="#d6a15c" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="1524" y="292" class="small">light direction</text>
  <rect x="1243" y="655" width="22" height="22" class="main"/><text x="1277" y="672" class="label">MainView first-hit occupancy</text><rect x="1500" y="655" width="22" height="22" class="shadow"/><text x="1534" y="672" class="label">ShadowMap first-hit occupancy</text>
  <text x="1243" y="735" class="small">Blue camera-facing and orange light-facing voxel surfaces update the same BBV.</text>
</svg>
