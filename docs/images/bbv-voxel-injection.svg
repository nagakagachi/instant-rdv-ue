<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <rect width="1600" height="640" fill="#ffffff"/>
  <style>.title{font:600 22px Arial,sans-serif;fill:#1f2933}.label{font:16px Arial,sans-serif;fill:#374151}.small{font:14px Arial,sans-serif;fill:#4b5563}.box{fill:#f8fafc;stroke:#6b7280;stroke-width:2}.viewray{stroke:#9ca3af;stroke-width:2;stroke-dasharray:6 5;fill:none}.flow{stroke:#2563a6;stroke-width:3;fill:none}.grid{stroke:#9ca3af;stroke-width:1;fill:none}.brick{stroke:#111827;stroke-width:4;fill:none}.surface{stroke:#4b5563;stroke-width:3;stroke-dasharray:7 4;fill:none}.blue{fill:#2563a6}</style>
  <text x="52" y="52" class="title">BBV voxel injection</text>

  <rect x="60" y="105" width="410" height="410" class="box"/>
  <text x="86" y="143" class="title">DepthBuffer side view</text>
  <text x="86" y="170" class="small">The nearest depth sample is selected for each view ray.</text>
  <rect x="88" y="296" width="44" height="34" fill="#374151"/><path d="M132 303 L156 313 L132 323 Z" fill="#374151"/><circle cx="107" cy="313" r="9" fill="#ffffff"/><text x="82" y="357" class="label">camera</text>
