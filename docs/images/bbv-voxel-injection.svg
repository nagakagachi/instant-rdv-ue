  <path d="M760 195 V515 M780 195 V515 M800 195 V515 M820 195 V515 M840 195 V515 M860 195 V515 M880 195 V515 M900 195 V515 M920 195 V515 M940 195 V515 M960 195 V515 M980 195 V515 M1000 195 V515 M1020 195 V515 M1040 195 V515 M1060 195 V515 M1080 195 V515 M1100 195 V515 M1120 195 V515 M1140 195 V515 M1160 195 V515 M1180 195 V515 M1200 195 V515 M1220 195 V515 M1240 195 V515 M1260 195 V515 M1280 195 V515 M1300 195 V515 M1320 195 V515 M1340 195 V515 M1360 195 V515 M1380 195 V515 M1400 195 V515 M1420 195 V515 M1440 195 V515 M740 215 H1460 M740 235 H1460 M740 255 H1460 M740 275 H1460 M740 295 H1460 M740 315 H1460 M740 335 H1460 M740 355 H1460 M740 375 H1460 M740 395 H1460 M740 415 H1460 M740 435 H1460 M740 455 H1460 M740 475 H1460 M740 495 H1460" class="grid"/>
  <rect x="900" y="195" width="160" height="160" class="brick"/><rect x="1060" y="195" width="160" height="160" class="brick"/><rect x="1220" y="195" width="160" height="160" class="brick"/>
  <rect x="900" y="355" width="160" height="160" class="brick"/><rect x="1060" y="355" width="160" height="160" class="brick"/><rect x="1220" y="355" width="160" height="160" class="brick"/>

  <rect x="1200" y="195" width="20" height="20" class="blue"/><rect x="1200" y="215" width="20" height="20" class="blue"/><rect x="1160" y="215" width="20" height="20" class="blue"/><rect x="1160" y="235" width="20" height="20" class="blue"/><rect x="1160" y="255" width="20" height="20" class="blue"/><rect x="1120" y="255" width="20" height="20" class="blue"/><rect x="1120" y="275" width="20" height="20" class="blue"/><rect x="1120" y="295" width="20" height="20" class="blue"/><rect x="1120" y="315" width="20" height="20" class="blue"/><rect x="1120" y="335" width="20" height="20" class="blue"/><rect x="1080" y="335" width="20" height="20" class="blue"/><rect x="1080" y="355" width="20" height="20" class="blue"/><rect x="1080" y="375" width="20" height="20" class="blue"/><rect x="1040" y="375" width="20" height="20" class="blue"/><rect x="1040" y="395" width="20" height="20" class="blue"/><rect x="1040" y="415" width="20" height="20" class="blue"/><path d="M1210 205 V225 H1170 V265 H1130 V305 H1130 V345 H1090 V385 H1050 V425" class="surface"/>
  <text x="900" y="550" class="label">bold borders: adjacent 8 x 8 x 8 bricks</text>
