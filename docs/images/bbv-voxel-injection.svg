  <text x="696" y="143" class="title">BBV brick grid</text>
  <text x="696" y="170" class="small">The same depth profile is expressed in BBV coordinates. Blue cells receive occupancy injection.</text><rect x="688" y="333" width="34" height="26" fill="#374151"/><path d="M722 339 L740 346 L722 353 Z" fill="#374151"/><circle cx="703" cy="346" r="7" fill="#ffffff"/><text x="680" y="382" class="small">same camera</text><path d="M730 346 H758" class="viewray"/>
